
name: HexOS Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m compileall -q main.py core shell apps

      - name: Create ZIP archive
        run: |
          zip -r HexOS.zip main.py README.md requirements.txt apps core shell data \
            -x "*/__pycache__/*" "*.pyc"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexOS-build
          path: HexOS.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" HexOS.zip \
            --title "HexOS $GITHUB_REF_NAME" \
            --generate-notes
